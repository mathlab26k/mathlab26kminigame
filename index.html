<!-- File: index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="5つの数学ゲームへの入口。遊びたいゲームを選んで始めましょう。"
  >
  <title>ミニゲーム</title>

  <style>
    :root {
      color-scheme: light;
      --background: #f3f6fc;
      --surface: #ffffff;
      --text: #17243b;
      --muted: #526178;
      --accent: #3157d5;
      --accent-hover: #2443ad;
      --border: #dce3ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .container {
      width: min(1080px, 92%);
      margin-inline: auto;
    }

    .hero {
      padding: 64px 0 40px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.3;
    }

    .intro {
      margin: 0;
      color: var(--muted);
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .summary {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgb(23 36 59 / 4%);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .game-number {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef1f6;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge.available {
      background: #e6f5ed;
      color: #17623c;
    }

    .game-card h3 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .game-description {
      flex-grow: 1;
      margin: 0 0 24px;
      color: var(--muted);
    }

    .play-button {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .play-button:hover {
      background: var(--accent-hover);
    }

    .play-button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 4px;
    }

    .notice {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      padding: 44px 0 28px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding-top: 40px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="hero container">
    <p class="eyebrow">MATH GAMES</p>
    <h1>ミニゲーム</h1>
    <p class="intro">
      考えて、試して、数学で遊ぶ。<br>
      気になるゲームを選んでください。
    </p>
  </header>

  <main class="container">
    <section aria-labelledby="games-heading">
      <h2 id="games-heading" class="section-title">ゲーム一覧</h2>
      <p id="game-summary" class="summary" aria-live="polite"></p>
      <div id="game-list" class="game-grid"></div>

      <noscript>
        <p>
          ゲーム一覧を表示するには、ブラウザーのJavaScriptを有効にしてください。
        </p>
      </noscript>

      <p class="notice">
        「遊ぶ」を押すと、それぞれのゲームのページに移動します。
        この一覧に戻るときは、ブラウザーの「戻る」を使ってください。
        準備中のゲームは、「開く」を押すと案内が表示されます。
      </p>
    </section>
  </main>

  <footer class="container">
    ミニゲーム
  </footer>

  <script>
    /*
     * ===== ゲームの設定 =====
     *
     * 【①②について】
     * 実際の公開リンクが不明なため、url は空欄にしています。
     * 各ゲームの url の二重引用符の間に、
     * ゲームが遊べる公開ページのリンクを貼り付けてください。
     * 以前のファイルに登録していたリンクがあれば、ここに転記します。
     *
     * 【③④⑤について】
     * 今は url を空欄のままにしてください。
     * ボタンを押すと「準備中です」と表示されます。
     *
     * ゲームが完成したら、同じリポジトリにゲームのページを追加し、
     * 対応する url に次のような相対リンクを設定できます。
     *
     * ③ ./sequent.html
     * ④ ./noether.html
     * ⑤ ./homology.html
     *
     * 外部で公開したゲームの完全なリンクも使用できます。
     * リンクを登録すると、自動的に「遊ぶ」ボタンになります。
     */

    const games = [
      {
        title: "正方形四目並べ",
        description: "正方形四目並べで遊んでみよう。",
        status: "公開済み",
        url: "https://ccbsapi.github.io/makesquare/"
      },
      {
        title: "大学数学の20の扉",
        description: "大学数学をテーマにした「20の扉」に挑戦。",
        status: "公開済み",
        url: "https://theorem-detective.vercel.app/"
      },
      {
        title: "シーケント計算ゲーム",
        description: "シーケント計算をテーマにしたゲーム。",
        status: "公開済み",
        url: "./sequent-game-unified-v3.html"
      },
      {
        title: "ネーター環ゲーム",
        description: "ネーター環をテーマにしたゲーム。",
        status: "公開済み",
        url: ".\Noetherian_ring_game_revised.html"
      },
      {
        title: "ホモロジー群当て",
        description: "ホモロジー群を当てるゲーム。",
        status: "公開済み",
        url: "./homology.html"
      }
    ];

    // 外部リンクと、同じサイト内の相対リンクに対応します。
    function getPlayableUrl(value) {
      const path = value.trim();

      // 空欄の場合はリンクを作りません。
      if (!path) {
        return null;
      }

      try {
        const url = new URL(path, document.baseURI);

        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch {
        return null;
      }

      return null;
    }

    const gameList = document.getElementById("game-list");
    const gameSummary = document.getElementById("game-summary");
    let availableCount = 0;

    games.forEach((game, index) => {
      const playableUrl = getPlayableUrl(game.url);

      const card = document.createElement("article");
      card.className = "game-card";

      const top = document.createElement("div");
      top.className = "card-top";

      const number = document.createElement("span");
      number.className = "game-number";
      number.textContent =
        `GAME ${String(index + 1).padStart(2, "0")}`;

      const badge = document.createElement("span");
      badge.className = playableUrl ? "badge available" : "badge";
      badge.textContent = playableUrl ? "公開中" : game.status;

      top.append(number, badge);

      const title = document.createElement("h3");
      title.textContent = game.title;

      const description = document.createElement("p");
      description.className = "game-description";
      description.textContent = game.description;

      let action;

      if (playableUrl) {
        availableCount += 1;

        action = document.createElement("a");
        action.href = playableUrl;
        action.textContent = "遊ぶ →";
        action.setAttribute(
          "aria-label",
          `${game.title}で遊ぶ`
        );
      } else {
        action = document.createElement("button");
        action.type = "button";

        const isPublished = game.status.includes("公開済み");

        action.textContent = isPublished
          ? "リンク登録待ち"
          : "開く →";

        action.setAttribute(
          "aria-label",
          `${game.title}の公開状況を確認する`
        );

        action.addEventListener("click", () => {
          const message = isPublished
            ? "ゲームのリンクがまだ登録されていません。"
            : "準備中です。公開までお待ちください。";

          window.alert(`${game.title}\n\n${message}`);
        });
      }

      action.className = "play-button";

      card.append(top, title, description, action);
      gameList.append(card);
    });

    gameSummary.textContent =
      `全${games.length}ゲームのうち、${availableCount}ゲームがここから遊べます。`;
  </script>
</body>
</html>
