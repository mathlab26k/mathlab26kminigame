<!-- File: index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="5つの数学ゲームへの入口。遊びたいゲームを選んで始めましょう。"
  >
  <title>数学ミニゲーム</title>

  <style>
    :root {
      color-scheme: light;
      --background: #f5fff2;
      --surface: #ffffff;
      --text: #173b24;
      --muted: #527961;
      --accent: #3b7e24;
      --accent-hover: #3E6331;
      --border: #1d380e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .container {
      width: min(1080px, 92%);
      margin-inline: auto;
    }

    .hero {
      padding: 64px 0 40px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.3;
    }

    .intro {
      margin: 0;
      color: var(--muted);
    }

    .section-title {
      margin: 0 0 24px;
      font-size: 1.4rem;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgb(23 36 59 / 4%);
    }

    .game-number {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .game-card h3 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .game-description {
      flex-grow: 1;
      margin: 0 0 24px;
      color: var(--muted);
    }

    .play-button {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
    }

    .play-button:hover {
      background: var(--accent-hover);
    }

    .play-button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 4px;
    }

    .notice {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      padding: 44px 0 28px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .hero {
        padding-top: 40px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="hero container">
    <p class="eyebrow">MATH GAMES</p>
    <h1>数学ミニゲーム</h1>
    <p class="intro">
      気になるゲームを選んでください。
    </p>
  </header>

  <main class="container">
    <section aria-labelledby="games-heading">
      <h2 id="games-heading" class="section-title">ゲーム一覧</h2>
      <div id="game-list" class="game-grid"></div>

      <noscript>
        <p>
          ゲーム一覧を表示するには、ブラウザーのJavaScriptを有効にしてください。
        </p>
      </noscript>

      <p class="notice">
        「遊ぶ」を押すと、それぞれのゲームのページに移動します。
        この一覧に戻るときは、ブラウザーの「戻る」を使ってください。
      </p>
    </section>
  </main>

  <footer class="container">
    数学ミニゲーム
  </footer>

  <script>
    const games = [
      {
        title: "正方形四目並べ",
        description: "正方形を作ったら勝ち、というルールの四目並べです。",
        url: "https://ccbsapi.github.io/makesquare/"
      },
      {
        title: "数学の20の扉",
        description: "扉の番人が思い浮かべた数学の定理を、20回の質問で当てるゲームです。",
        url: "https://theorem-detective.vercel.app/"
      },
      {
        title: "シーケント計算ゲーム",
        description: "群や自然数についての命題の形式的証明をしていくパズルです。",
        url: "./sequent-game-unified-v3.html"
      },
      {
        title: "ネーター環ゲーム",
        description: "ネーター環のイデアルを交互に拡大していきます。極大イデアルにすると負け。",
        url: "./Noetherian_ring_game_revised.html"
      },
      {
        title: "ホモロジー群当て",
        description: "地下空間の1次の整数係数ホモロジー群を当てると脱出できます。",
        url: "./homology.html"
      }
    ];

    const gameList = document.getElementById("game-list");

    games.forEach((game, index) => {
      const card = document.createElement("article");
      card.className = "game-card";

      const number = document.createElement("p");
      number.className = "game-number";
      number.textContent =
        `GAME ${String(index + 1).padStart(2, "0")}`;

      const title = document.createElement("h3");
      title.textContent = game.title;

      const description = document.createElement("p");
      description.className = "game-description";
      description.textContent = game.description;

      const action = document.createElement("a");
      action.className = "play-button";
      action.href = game.url;
      action.textContent = "遊ぶ →";
      action.setAttribute("aria-label", `${game.title}で遊ぶ`);

      card.append(number, title, description, action);
      gameList.append(card);
    });
  </script>
</body>
</html>
